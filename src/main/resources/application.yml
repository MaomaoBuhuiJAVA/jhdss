server:
  port: 9117
  servlet:
    context-path: /jhds

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/jhds?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${SPRING_DATASOURCE_USERNAME:root}
    # Read the local password from .env.local.bat; keep the original value as
    # a fallback for installations that still use the default credentials.
    password: ${SPRING_DATASOURCE_PASSWORD:a123456}
    druid:
      initial-size: 5
      max-active: 200
      min-idle: 10
      max-wait: 60000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      time-between-eviction-runs-millis: 3600000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: NON_NULL
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 5000
    jedis:
      pool:
        max-active: 200
        max-idle: 50
        max-wait: 1000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jhds.entity
  type-handlers-package: com.jhds.handler
  configuration:
    map-underscore-to-camel-case: true
    # 开发环境打印SQL，生产环境请注释掉下一行
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

swagger:
  enable: true
  title: jhds 智慧农业云平台
  description: jhds 智慧农业云平台 API 接口文档
  version: 1.0
  base-package: com.jhds.controller

device:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://11046xnld7705.vicp.fun:1883}
    # Must differ from the USR DTU client id (jhdskouhong).
    client-id: ${MQTT_CLIENT_ID:jhdss-web-control}
    username: ${MQTT_USERNAME:mqttuser}
    password: ${MQTT_PASSWORD:a123456}
    topic:
      prefix: /iot/jhds/prod
      command-suffix: command
      response-suffix: response
    connection-timeout: ${MQTT_CONNECTION_TIMEOUT:10}
    keepalive-interval: ${MQTT_KEEPALIVE_SECONDS:60}
    clean-session: ${MQTT_CLEAN_SESSION:false}
    append-instance-id: ${MQTT_APPEND_INSTANCE_ID:true}
    transparent-mode: ${MQTT_TRANSPARENT_MODE:true}
    ignore-echo: ${MQTT_IGNORE_ECHO:true}
    # 实时设备动作不能在离线期间排队，否则设备重连后可能执行过期指令。
    # QoS 0 配合串口响应校验：在线时正常执行，离线时失败并由页面提示重试。
    command-qos: ${MQTT_COMMAND_QOS:0}
    response-qos: ${MQTT_RESPONSE_QOS:1}
    reconnect-interval-ms: ${MQTT_RECONNECT_INTERVAL_MS:10000}
    reconnect-initial-delay-ms: ${MQTT_RECONNECT_INITIAL_DELAY_MS:10000}
    enabled: ${MQTT_ENABLED:true}
  commands:
    motor-direction-open: ${MOTOR_DIRECTION_OPEN_HEX:}
    motor-direction-close: ${MOTOR_DIRECTION_CLOSE_HEX:}
    motor-state-open: ${MOTOR_STATE_OPEN_HEX:}
    motor-state-close: ${MOTOR_STATE_CLOSE_HEX:}
    # 轨道电机使用短确认窗口，避免一次动作因串口回执缺失等待 5 秒。
    motor-confirmation-timeout-ms: ${MOTOR_CONFIRMATION_TIMEOUT_MS:1200}

custom:
  redis:
    key-prefix: "jhds:"
    command-timeout: 30
    sensor-data-ttl: 3600

insect:
  api:
    base-url: ${INSECT_API_BASE_URL:http://app.wlwapp.cn}
    username: ${INSECT_API_USERNAME}
    password: ${INSECT_API_PASSWORD}
    token-ttl: 7

ys7:
  app-key: ${YS7_APP_KEY}
  app-secret: ${YS7_APP_SECRET}
  verify-code: ${YS7_VERIFY_CODE:}
  # The C6c serial printed on the camera. These can be overridden in .env.local.bat.
  device-serial: ${YS7_DEVICE_SERIAL:BG9980884}
  channel-no: ${YS7_CHANNEL_NO:1}
  # EZVIZ protocol 4 is FLV (lower latency); the browser falls back to HLS (2) when needed.
  protocol: ${YS7_LIVE_PROTOCOL:4}
  # 2=子码流（低延迟）；设置 YS7_STREAM_TYPE=1 可恢复主码流画质。
  stream-type: ${YS7_STREAM_TYPE:2}
  force-h264: ${YS7_FORCE_H264:true}

# Local RTSP camera bridge. Enable this on the computer connected to the same
# LAN as the camera; FFmpeg converts RTSP to low-bitrate H.264/AAC HLS for the browser.
camera:
  local:
    enabled: ${CAMERA_LOCAL_ENABLED:false}
    host: ${CAMERA_LOCAL_HOST:127.0.0.1}
    port: ${CAMERA_LOCAL_PORT:554}
    username: ${CAMERA_LOCAL_USERNAME:admin}
    password: ${CAMERA_LOCAL_PASSWORD:}
    path: ${CAMERA_LOCAL_PATH:/ch1/main}
    fallback-path: ${CAMERA_LOCAL_FALLBACK_PATH:/ch1/sub}
    prefer-fallback: ${CAMERA_LOCAL_PREFER_FALLBACK:true}
    transport: ${CAMERA_LOCAL_TRANSPORT:tcp}
    ffmpeg-path: ${CAMERA_LOCAL_FFMPEG_PATH:ffmpeg}
    hls-path: ${CAMERA_LOCAL_HLS_PATH:./work/camera/hls}
    width: ${CAMERA_LOCAL_WIDTH:720}
    video-bitrate: ${CAMERA_LOCAL_VIDEO_BITRATE:2400k}
    video-buffer-size: ${CAMERA_LOCAL_VIDEO_BUFFER_SIZE:3600k}
    segment-seconds: ${CAMERA_LOCAL_SEGMENT_SECONDS:1}
    list-size: ${CAMERA_LOCAL_LIST_SIZE:3}
    connect-timeout-ms: ${CAMERA_LOCAL_CONNECT_TIMEOUT_MS:8000}
    startup-timeout-ms: ${CAMERA_LOCAL_STARTUP_TIMEOUT_MS:30000}
    stale-timeout-ms: ${CAMERA_LOCAL_STALE_TIMEOUT_MS:30000}
    restart-cooldown-ms: ${CAMERA_LOCAL_RESTART_COOLDOWN_MS:10000}
    capture-segment-timeout-ms: ${CAMERA_LOCAL_CAPTURE_SEGMENT_TIMEOUT_MS:30000}
  speech:
    broadcast-enabled: ${CAMERA_SPEECH_BROADCAST_ENABLED:false}
    connection-announcements-enabled: ${CAMERA_SPEECH_CONNECTION_ANNOUNCEMENTS_ENABLED:false}
    connection-initial-delay-ms: ${CAMERA_SPEECH_CONNECTION_INITIAL_DELAY_MS:5000}
    connection-check-interval-ms: ${CAMERA_SPEECH_CONNECTION_CHECK_INTERVAL_MS:10000}

ollama:
  base-url: http://localhost:11434
  model: qwen2.5vl:7b
  options:
    temperature: 0.1
    num-predict: 2048
    num-ctx: 16384

dashscope:
  api-key: ${DASHSCOPE_API_KEY}
  base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
  model: kimi-k2.7-code
  options:
    temperature: 0.1
    max-tokens: 2048

xfyun:
  tts:
    enabled: ${XFYUN_TTS_ENABLED:false}
    app-id: ${XFYUN_TTS_APP_ID:}
    api-key: ${XFYUN_TTS_API_KEY:}
    api-secret: ${XFYUN_TTS_API_SECRET:}
    websocket-url: ${XFYUN_TTS_WEBSOCKET_URL:https://tts-api.xfyun.cn/v2/tts}
    voice-name: ${XFYUN_TTS_VOICE_NAME:x4_yezi}
    speed: ${XFYUN_TTS_SPEED:50}
    volume: ${XFYUN_TTS_VOLUME:100}
    pitch: ${XFYUN_TTS_PITCH:50}
    timeout-ms: ${XFYUN_TTS_TIMEOUT_MS:15000}

patrol:
  capture-path: ./captures
  automatic:
    output-path: ${PATROL_AUTO_OUTPUT_PATH:./LabelImg资料图片/摄像头实际拍摄照片}
    # 2026-09-07现场标定：右到左有效运动18.422秒，下到上有效运动11.587秒。
    horizontal-travel-ms: ${PATROL_HORIZONTAL_TRAVEL_MS:18422}
    vertical-travel-ms: ${PATROL_VERTICAL_TRAVEL_MS:11587}
    # 垂直行程使用92%安全比例；水平行程的80%同时是轨道左侧软限位，
    # 自动巡检和手动左右移动都不会越过它，最右侧端点仍可到达。
    coverage-ratio: ${PATROL_COVERAGE_RATIO:0.92}
    horizontal-coverage-ratio: ${PATROL_HORIZONTAL_COVERAGE_RATIO:0.80}
    # 右下起步时默认将云台向下校准到最低视角，避免每条扫描线累计云台误差。
    ptz-pan-direction: ${PATROL_PTZ_PAN_DIRECTION:2}
    ptz-pan-ms: ${PATROL_PTZ_PAN_MS:350}
    ptz-tilt-direction: ${PATROL_PTZ_TILT_DIRECTION:1}
    ptz-tilt-ms: ${PATROL_PTZ_TILT_MS:180}
    settle-ms: ${PATROL_SETTLE_MS:350}

# Bluetooth PAN irrigation controller. Override on the deployment computer
# when the controller receives a different link-local address.
control-panel:
  base-url: ${CONTROL_PANEL_BASE_URL:http://169.254.240.33}
  connect-timeout-ms: ${CONTROL_PANEL_CONNECT_TIMEOUT_MS:1200}
  read-timeout-ms: ${CONTROL_PANEL_READ_TIMEOUT_MS:3000}

archive:
  upload-path: ./uploads/archive

ai:
  yolo:
    enabled: ${AI_YOLO_ENABLED:false}
    python-path: ${AI_YOLO_PYTHON_PATH:D:/jhdss-tools/yolo-venv311/Scripts/python.exe}
    model-path: ${AI_YOLO_MODEL_PATH:./LabelImg资料图片/yolo_runs/black_longhorn_yolo11s/weights/best.pt}
    script-path: ${AI_YOLO_SCRIPT_PATH:./scripts/yolo_infer.py}
    worker-script-path: ${AI_YOLO_WORKER_SCRIPT_PATH:./scripts/yolo_worker.py}
    upload-path: ${AI_YOLO_UPLOAD_PATH:./uploads/ai-inference}
    evaluation-path: ${AI_YOLO_EVALUATION_PATH:./LabelImg资料图片/yolo_runs/camera_test_eval}
    evaluation-source-path: ${AI_YOLO_EVALUATION_SOURCE_PATH:./LabelImg资料图片/yolo_dataset/camera_test}
    confidence: ${AI_YOLO_CONFIDENCE:0.25}
    timeout-seconds: ${AI_YOLO_TIMEOUT_SECONDS:120}
    realtime-timeout-seconds: ${AI_YOLO_REALTIME_TIMEOUT_SECONDS:20}
    realtime-interval-ms: ${AI_YOLO_REALTIME_INTERVAL_MS:1000}
    alarm-cooldown-seconds: ${AI_YOLO_ALARM_COOLDOWN_SECONDS:60}
    alarm-enabled: ${AI_YOLO_ALARM_ENABLED:true}
    device: ${AI_YOLO_DEVICE:0}

logging:
  level:
    com.jhds: debug
