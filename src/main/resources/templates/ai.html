<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jhds - AI 农业助手</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css(v='20260912-card-edge-v1')}">
    <link rel="stylesheet" th:href="@{/css/ai.css(v='20260913-microscope-cast-v1')}">
</head>
<body>
    <div th:replace="fragments/header::header('ai')"></div>

    <main class="main ai-page">
        <aside class="ai-conversations" aria-label="AI 会话导航">
            <div class="ai-sidebar-tabs" aria-label="助手模式">
                <span class="active">对话</span>
            </div>
            <nav class="ai-sidebar-actions" aria-label="会话工具">
                <button type="button" class="new-conversation" id="newChatBtn"><i class="ri-edit-circle-line"></i><span>发起新对话</span></button>
                <button type="button" class="sidebar-action" id="conversationSearchToggle" aria-expanded="false" aria-controls="conversationSearch"><i class="ri-search-line"></i><span>搜索对话内容</span></button>
                <button class="sidebar-action" id="aiVideoUpload" type="button" aria-haspopup="dialog" aria-controls="aiVideoModal"><i class="ri-video-line"></i><span>视频识别</span></button>
            </nav>
            <div class="conversation-search" id="conversationSearch" hidden>
                <i class="ri-search-line"></i>
                <input type="search" id="conversationSearchInput" placeholder="搜索最近会话" autocomplete="off">
                <button type="button" id="conversationSearchClose" title="关闭搜索"><i class="ri-close-line"></i></button>
            </div>
            <div class="conversation-scroll">
                <div class="conversation-list-label">最近</div>
                <section class="conversation-group"><div class="conversation-group-title"><span>今天</span></div><button type="button" class="conversation-item"><span>3号棚白粉病诊断</span><small>16:32</small></button><button type="button" class="conversation-item"><span>夏季温湿度调控建议</span><small>14:27</small></button><button type="button" class="conversation-item"><span>叶斑病视频复检</span><small>11:03</small></button></section>
                <section class="conversation-group"><div class="conversation-group-title"><span>近7天</span></div><button type="button" class="conversation-item"><span>1号棚营养液EC异常分析</span><small>06-10</small></button><button type="button" class="conversation-item"><span>裂果原因分析</span><small>06-09</small></button><button type="button" class="conversation-item"><span>樱桃膨果期管理建议</span><small>06-08</small></button><button type="button" class="conversation-item"><span>病虫害综合防治方案</span><small>06-07</small></button></section>
                <section class="conversation-group conversation-group-bottom"><div class="conversation-group-title"><span>更早</span></div><button type="button" class="conversation-item"><span>土壤基质改良方案</span><small>05-28</small></button><button type="button" class="conversation-item"><span>智能灌溉参数设置</span><small>05-10</small></button></section>
            </div>
        </aside>
        <section class="ai-workspace card">
            <header class="ai-workspace-head">
                <label class="greenhouse-select">关联大棚：<select aria-label="关联大棚"><option>3号大棚</option><option>1号大棚</option><option>2号大棚</option><option>4号大棚</option></select></label>
                <div class="microscope-cast-actions" aria-label="镜检投屏">
                    <button type="button" class="microscope-cast-trigger" data-cast-title="体视镜投屏" th:data-video-src="@{/videos/red-spider-stereoscope.mp4}" aria-haspopup="dialog" aria-controls="microscopeCastOverlay"><i class="ri-camera-lens-line"></i><span>体视镜投屏</span></button>
                    <button type="button" class="microscope-cast-trigger" data-cast-title="显微镜投屏" th:data-video-src="@{/videos/brown-spot-microscope.mp4}" aria-haspopup="dialog" aria-controls="microscopeCastOverlay"><i class="ri-microscope-line"></i><span>显微镜投屏</span></button>
                </div>
            </header>
            <div class="ai-main">
            <div class="messages" id="messages"></div>

            <div class="input-area">
                <div class="image-preview" id="imagePreview" style="display:none;">
                    <img id="previewImg" src="" alt="预览">
                    <button class="image-preview-remove" id="removeImageBtn" type="button">&times;</button>
                </div>
                <div class="input-wrapper">
                    <label class="file-upload-control" title="上传图片">
                        <span class="file-folder" aria-hidden="true">
                            <span class="folder-back"></span>
                            <span class="folder-sheet folder-sheet-one"></span>
                            <span class="folder-sheet folder-sheet-two"></span>
                            <span class="folder-front"></span>
                        </span>
                        <span class="file-upload-label">文件</span>
                        <input type="file" id="imageInput" accept="image/*" capture="environment">
                    </label>
                    <div class="ai-input-container">
                        <textarea class="input-box" id="inputBox" rows="1" placeholder="输入您的问题..."></textarea>
                        <span class="input-highlight" aria-hidden="true"></span>
                    </div>
                    <button class="send-btn" id="sendBtn" title="发送 (Enter)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                </div>
            </div>
        </section>
    </main>

    <div class="ai-video-modal" id="aiVideoModal" hidden>
        <button class="ai-video-backdrop" type="button" data-video-close aria-label="关闭视频识别"></button>
        <section class="ai-video-dialog" role="dialog" aria-modal="true" aria-labelledby="aiVideoModalTitle">
            <header class="ai-video-dialog-head">
                <div>
                    <span><i class="ri-video-line"></i> 视频识别</span>
                    <h2 id="aiVideoModalTitle">上传巡检视频进行 AI 分析</h2>
                </div>
                <button class="ai-video-close" type="button" data-video-close title="关闭"><i class="ri-close-line"></i></button>
            </header>
            <div class="ai-video-dialog-body" id="aiVideoDialogBody">
                <input type="file" id="aiVideoFileInput" accept="video/*" hidden>

                <section class="ai-video-stage ai-video-idle" data-video-stage="idle">
                    <button class="ai-video-dropzone" id="aiVideoDropzone" type="button">
                        <span class="ai-video-upload-orb"><i class="ri-upload-cloud-2-line"></i></span>
                        <strong>选择或拖入农事巡检视频</strong>
                        <small>系统将提取清晰画面，并匹配数据库中的识别资料</small>
                    </button>
                    <button class="ai-video-action primary" type="button" data-video-pick><i class="ri-folder-video-line"></i>选择视频</button>
                </section>

                <section class="ai-video-stage ai-video-selected" data-video-stage="selected" hidden>
                    <figure class="ai-video-preview">
                        <img id="aiVideoCover" alt="巡检视频封面">
                        <figcaption><span id="aiVideoFileName"></span><b>视频已就绪</b></figcaption>
                    </figure>
                    <div class="ai-video-actions">
                        <button class="ai-video-action" type="button" data-video-pick><i class="ri-refresh-line"></i>更换视频</button>
                        <button class="ai-video-action primary" id="aiVideoScanBtn" type="button"><i class="ri-scan-2-line"></i>开始识别</button>
                    </div>
                </section>

                <section class="ai-video-stage ai-video-scanning" data-video-stage="scanning" hidden aria-live="polite">
                    <div class="ai-video-scan-frame">
                        <img id="aiVideoScanImage" alt="正在分析的视频画面">
                        <span class="ai-video-scan-grid"></span>
                        <span class="ai-video-scan-line"></span>
                        <div class="ai-video-scan-status"><b id="aiVideoScanPercent">0%</b><span id="aiVideoScanText">正在初始化识别任务</span></div>
                    </div>
                    <div class="ai-video-progress"><span id="aiVideoProgressBar"></span></div>
                </section>

                <section class="ai-video-stage ai-video-done" data-video-stage="done" hidden>
                    <div class="ai-video-result-head">
                        <div><span><i class="ri-checkbox-circle-line"></i> 分析完成</span><h3>已生成视频识别知识卡片</h3></div>
                        <button class="ai-video-action" id="aiVideoRetryBtn" type="button"><i class="ri-restart-line"></i>重新分析</button>
                    </div>
                    <div class="ai-video-result-grid" id="aiVideoResultGrid"></div>
                </section>
            </div>
        </section>
    </div>

    <div class="microscope-cast-overlay" id="microscopeCastOverlay" hidden>
        <section class="microscope-cast-player" role="dialog" aria-modal="true" aria-labelledby="microscopeCastTitle">
            <video id="microscopeCastVideo" preload="auto" autoplay loop muted playsinline></video>
            <div class="microscope-cast-shade" aria-hidden="true"></div>
            <header class="microscope-cast-head">
                <div><i class="ri-live-line"></i><span>实时镜检画面</span><h2 id="microscopeCastTitle">体视镜投屏</h2></div>
                <button type="button" class="microscope-cast-icon" data-cast-close title="关闭投屏" aria-label="关闭投屏"><i class="ri-close-line"></i></button>
            </header>
            <div class="microscope-cast-status" id="microscopeCastStatus" aria-live="polite"><i class="ri-loader-4-line"></i><span>正在连接镜检画面</span></div>
            <footer class="microscope-cast-controls">
                <button type="button" class="microscope-cast-icon" id="microscopeCastSound" title="开启声音" aria-label="开启声音" aria-pressed="false"><i class="ri-volume-mute-line"></i></button>
                <span id="microscopeCastTime">00:00 / 00:00</span>
                <button type="button" class="microscope-cast-icon" id="microscopeCastFullscreen" title="浏览器全屏" aria-label="浏览器全屏"><i class="ri-fullscreen-line"></i></button>
            </footer>
        </section>
    </div>

    <script th:src="@{/js/common.js(v='20260912-page-motion')}"></script>
    <script th:src="@{/js/ai.js(v='20260912-ai-avatar-motion-v1')}"></script>
    <script th:src="@{/js/ai-video-modal.js(v='20260912-ai-avatar-motion-v1')}"></script>
    <script th:src="@{/js/ai-microscope-cast.js(v='20260913-microscope-cast-v1')}"></script>
</body>
</html>
