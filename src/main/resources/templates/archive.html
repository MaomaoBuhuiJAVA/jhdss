<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jhds - 植株历年档案</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/archive.css}">
</head>
<body>
    <div th:replace="fragments/header::header('archive')"></div>

    <main class="main archive-layout">
        <aside class="card plant-side" aria-label="植株档案列表">
            <div class="side-head">
                <span class="t"><i class="ri-archive-line"></i>植株档案</span>
                <button class="btn-new" type="button" onclick="openCreatePlant()"><i class="ri-add-line"></i>新建</button>
            </div>
            <div class="search-box">
                <i class="ri-search-line" aria-hidden="true"></i>
                <input type="search" id="search-input" placeholder="搜索植物名称 / 品种 / 学名" aria-label="搜索植株档案"
                       onkeyup="if(event.key==='Enter')loadPlants()">
                <button class="search-clear" type="button" id="search-clear" onclick="clearPlantSearch()" aria-label="清除搜索" hidden><i class="ri-close-line"></i></button>
            </div>
            <div class="plant-list scrollbar" id="plant-list">
                <div class="empty-state" style="padding:26px 10px;text-align:center;color:var(--text-dim);font-size:12px;">
                    <i class="ri-loader-4-line spinning" style="font-size:26px;display:block;margin-bottom:8px;"></i>正在加载档案…
                </div>
            </div>
            <div class="side-foot" id="plant-count"></div>
        </aside>

        <section class="archive-main" aria-label="年度档案详情">
            <div class="card topbar">
                <div class="plant-title" id="top-title">
                    <div class="placeholder-title"><i class="ri-file-search-line"></i><span>请选择或新建植株档案</span></div>
                </div>
                <div class="year-tabs" id="year-tabs" aria-label="年度档案"></div>
            </div>
            <div class="card blocktabs" id="block-tabs" role="tablist" aria-label="档案分类">
                <button class="btab active" data-b="base" role="tab" aria-selected="true" onclick="switchBlock('base')"><i class="ri-file-user-line"></i><span>基础档案</span></button>
                <button class="btab" data-b="pheno" role="tab" aria-selected="false" onclick="switchBlock('pheno')"><i class="ri-calendar-check-line"></i><span>物候年历</span></button>
                <button class="btab" data-b="cult" role="tab" aria-selected="false" onclick="switchBlock('cult')"><i class="ri-tools-line"></i><span>栽培管理</span></button>
                <button class="btab" data-b="pest" role="tab" aria-selected="false" onclick="switchBlock('pest')"><i class="ri-bug-2-line"></i><span>病虫害逆境</span></button>
                <button class="btab" data-b="growth" role="tab" aria-selected="false" onclick="switchBlock('growth')"><i class="ri-line-chart-line"></i><span>生长观测</span></button>
                <button class="btab" data-b="sum" role="tab" aria-selected="false" onclick="switchBlock('sum')"><i class="ri-medal-line"></i><span>年终总结</span></button>
            </div>
            <div class="card block-body scrollbar">
                <div class="block show" id="block-base" role="tabpanel"></div>
                <div class="block" id="block-pheno" role="tabpanel" hidden></div>
                <div class="block" id="block-cult" role="tabpanel" hidden></div>
                <div class="block" id="block-pest" role="tabpanel" hidden></div>
                <div class="block" id="block-growth" role="tabpanel" hidden></div>
                <div class="block" id="block-sum" role="tabpanel" hidden></div>
            </div>
        </section>
    </main>

    <div class="ai-float" onclick="location.href='/jhds/ai'" style="cursor:pointer;">
        <i class="ri-robot-2-line"></i>
        <span>AI 农业管家</span>
        <span>点击开始对话</span>
    </div>

    <div class="modal-overlay" id="modal-overlay" hidden onclick="if(event.target===this)closeModal()">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-head"><span id="modal-title">编辑</span><button class="modal-close" type="button" onclick="closeModal()" aria-label="关闭"><i class="ri-close-line"></i></button></div>
            <div class="modal-body scrollbar" id="modal-body"></div>
            <div class="modal-foot">
                <button class="btn-ghost" type="button" onclick="closeModal()">取消</button>
                <button class="btn-primary" type="button" id="modal-ok" onclick="modalOnOk()">保存</button>
            </div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/archive.js}"></script>
</body>
</html>
