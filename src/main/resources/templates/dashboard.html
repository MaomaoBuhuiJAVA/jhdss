<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jhds - 数据大屏</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <script th:src="@{/js/lib/flv.min.js}"></script>
</head>
<body>
    <div th:replace="fragments/header::header('dashboard')"></div>

    <main class="main">
        <aside class="left-sidebar">
            <div class="card">
                <div class="card-header"><i class="ri-home-4-line"></i><span>大棚信息</span></div>
                <div class="greenhouse-info">
                    <div class="gh-title">
                        <div class="gh-icon"><i class="ri-home-4-line"></i></div>
                        <div><div class="gh-name" id="dashboard-greenhouse-name">--</div></div>
                    </div>
                    <div class="info-row"><span class="info-label">大棚类型</span><span class="info-value" id="dashboard-greenhouse-type">--</span></div>
                    <div class="info-row"><span class="info-label">作物名称</span><span class="info-value" id="dashboard-greenhouse-crop">--</span></div>
                    <div class="info-row"><span class="info-label">种植面积</span><span class="info-value" id="dashboard-greenhouse-area">--</span></div>
                    <div class="info-row"><span class="info-label">定植株数</span><span class="info-value" id="dashboard-greenhouse-plant-count">--</span></div>
                    <div class="info-row"><span class="info-label">定植日期</span><span class="info-value" id="dashboard-greenhouse-planting-date">--</span></div>
                </div>
            </div>
            <div class="card" style="flex:1; display:flex; flex-direction:column;">
                <div class="card-header"><i class="ri-tools-line"></i><span>农事操作</span></div>
                <div style="flex:1; overflow-y:auto;">
                    <div id="dashboard-operation-list"></div>
                    <div style="border-top:1px solid rgba(30,60,100,0.3); margin:0 18px;"></div>
                    <div style="padding:10px 18px 4px; font-size:12px; font-weight:600; color:var(--accent-primary); letter-spacing:0.04em;"><i class="ri-calendar-check-line" style="margin-right:6px;"></i>待办农事</div>
                    <div class="todo-table" style="padding-bottom:4px;">
                        <div class="todo-header"><div class="col-week">时间</div><div class="col-task">农事</div><div class="col-action">操作</div></div>
                        <div id="dashboard-todo-list"></div>
                    </div>
                </div>
            </div>
        </aside>
        <section class="center-area">
            <div class="tabs-bar">
                <div class="tab-item active"><div class="tab-name">种植架1</div></div>
                <div class="tab-item"><div class="tab-name">种植架2</div></div>
                <div class="tab-item"><div class="tab-name">种植架3</div></div>
                <div class="tab-item"><div class="tab-name">种植架4</div></div>
            </div>
            <div class="video-area">
                <div class="video-header">
                    <div class="video-status"><div class="status-dot"></div><span style="font-size:13px; font-weight:500;">主监控</span><span class="status-badge">LIVE</span></div>
                    <span class="video-time">CH-01 &nbsp; 16:9</span>
                </div>
                <div class="video-main">
                    <video id="dashboard-video-player" class="dashboard-video-player" autoplay muted playsinline></video>
                    <div class="video-placeholder" id="dashboard-video-placeholder" style="display:none;"><i class="ri-video-line"></i><p>暂无画面，等待信号接入</p></div>
                </div>
                <div class="video-footer"><div class="cam-label">次监控</div><span class="video-time">CH-02 &nbsp; 16:9</span></div>
            </div>
        </section>
        <aside class="right-sidebar">
            <div class="card weather-thumb" onclick="location.href='/jhds/weather'" style="cursor:pointer;">
                <div class="card-header"><i class="ri-cloud-windy-line"></i><span>气象站</span></div>
                <div class="wt-grid" id="weather-thumb">
                    <div class="wt-item"><div class="wt-icon"><i class="ri-temp-hot-line"></i></div><div class="wt-info"><div class="wt-label">温度</div><div class="wt-value" id="wt-temp">--°C</div></div></div>
                    <div class="wt-item"><div class="wt-icon"><i class="ri-drop-line"></i></div><div class="wt-info"><div class="wt-label">湿度</div><div class="wt-value" id="wt-humidity">--%</div></div></div>
                    <div class="wt-item"><div class="wt-icon"><i class="ri-wind-line"></i></div><div class="wt-info"><div class="wt-label">风速</div><div class="wt-value" id="wt-wind">--m/s</div></div></div>
                    <div class="wt-item"><div class="wt-icon"><i class="ri-navigation-line"></i></div><div class="wt-info"><div class="wt-label">风向</div><div class="wt-value" id="wt-wind-dir">--</div></div></div>
                </div>
            </div>
            <div class="card card-alarm dashboard-reveal-card" id="dashboard-alert-card" hidden>
                <div class="card-header" style="justify-content:space-between;">
                    <div style="display:flex; align-items:center; gap:8px;"><i class="ri-alarm-warning-line" style="color:#ff4d6a;text-shadow:0 0 8px rgba(255,77,106,0.5);"></i><span>告警信息</span></div>
                    <span style="font-size:11px; color:#7b8fa8; cursor:pointer; letter-spacing:0.04em; transition:color 0.3s;" onmouseover="this.style.color='#ff4d6a'" onmouseout="this.style.color='#7b8fa8'"><i class="ri-history-line"></i> 历史记录</span>
                </div>
                <div id="dashboard-alarm-list"></div>
            </div>
            <div class="card market-feedback-card" style="flex:1;">
                <div class="card-header"><i class="ri-message-3-line"></i><span>市场反馈</span></div>
                <div class="market-feedback-list" id="dashboard-market-feedback-list"></div>
            </div>
        </aside>
    </main>

    <div class="dashboard-modal-overlay" id="dashboard-modal" hidden>
        <section class="dashboard-modal" role="dialog" aria-modal="true" aria-labelledby="dashboard-modal-title">
            <header class="dashboard-modal-header">
                <h2 id="dashboard-modal-title"></h2>
                <button class="dashboard-modal-close" type="button" onclick="closeDashboardModal()" aria-label="关闭"><i class="ri-close-line"></i></button>
            </header>
            <div class="dashboard-modal-body" id="dashboard-modal-body"></div>
        </section>
    </div>

    <div class="ai-float" onclick="location.href='/jhds/ai'" style="cursor:pointer;">
        <i class="ri-robot-2-line"></i>
        <span>AI 农业管家</span>
        <span>点击开始对话</span>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
    <script>
        let dashboardFlvPlayer = null;
        let dashboardVideoReady = false;
        let dashboardLatencyTimer = null;
        let dashboardWatchdogTimer = null;
        let dashboardRecoveryTimer = null;
        let dashboardLastProgressAt = 0;
        let dashboardInitStartedAt = 0;

        function destroyDashboardPlayer() {
            if (dashboardRecoveryTimer) {
                clearTimeout(dashboardRecoveryTimer);
                dashboardRecoveryTimer = null;
            }
            if (dashboardWatchdogTimer) {
                clearInterval(dashboardWatchdogTimer);
                dashboardWatchdogTimer = null;
            }
            if (dashboardLatencyTimer) {
                clearInterval(dashboardLatencyTimer);
                dashboardLatencyTimer = null;
            }
            if (dashboardFlvPlayer) {
                try {
                    dashboardFlvPlayer.pause();
                    dashboardFlvPlayer.unload();
                    dashboardFlvPlayer.detachMediaElement();
                    dashboardFlvPlayer.destroy();
                } catch (e) { /* ignore */ }
                dashboardFlvPlayer = null;
            }
            const video = document.getElementById('dashboard-video-player');
            if (video) {
                video.onplaying = null;
                video.onerror = null;
                video.ontimeupdate = null;
                video.onstalled = null;
                video.onwaiting = null;
            }
            dashboardVideoReady = false;
        }

        function scheduleDashboardRecovery(delay) {
            if (dashboardRecoveryTimer || document.hidden) return;
            dashboardRecoveryTimer = window.setTimeout(function () {
                dashboardRecoveryTimer = null;
                initDashboardVideo();
            }, delay || 1000);
        }

        function startDashboardWatchdog(video) {
            if (dashboardWatchdogTimer) clearInterval(dashboardWatchdogTimer);
            dashboardInitStartedAt = Date.now();
            dashboardLastProgressAt = dashboardInitStartedAt;
            dashboardWatchdogTimer = window.setInterval(function () {
                if (document.hidden || dashboardRecoveryTimer) return;
                const now = Date.now();
                if ((!dashboardVideoReady && now - dashboardInitStartedAt > 12000) ||
                    (dashboardVideoReady && now - dashboardLastProgressAt > 6000)) {
                    scheduleDashboardRecovery(300);
                }
            }, 2000);
        }

        function startDashboardLatencyMonitor(video) {
            if (dashboardLatencyTimer) clearInterval(dashboardLatencyTimer);
            dashboardLatencyTimer = window.setInterval(function () {
                if (!video || video.paused || video.seeking || video.readyState < 3 || !video.buffered.length) return;
                const end = video.buffered.end(video.buffered.length - 1);
                if (end - video.currentTime > 2.5) video.currentTime = Math.max(0, end - 0.35);
            }, 1000);
        }

        function initDashboardVideo() {
            const video = document.getElementById('dashboard-video-player');
            const placeholder = document.getElementById('dashboard-video-placeholder');
            if (!video) return;

            destroyDashboardPlayer();
            startDashboardWatchdog(video);

            apiGet('/camera/play-url?deviceSerial=BG9980884').then(res => {
                if (!res || !res.data) {
                    if (placeholder) placeholder.style.display = 'flex';
                    return;
                }
                try {
                    if (typeof flvjs === 'undefined') {
                        if (placeholder) { placeholder.innerHTML = '<i class="ri-video-line"></i><p>播放器组件加载失败</p>'; placeholder.style.display = 'flex'; }
                        return;
                    }
                    if (!flvjs.isSupported()) {
                        if (placeholder) { placeholder.innerHTML = '<i class="ri-video-line"></i><p>浏览器不支持视频播放</p>'; placeholder.style.display = 'flex'; }
                        return;
                    }
                    destroyDashboardPlayer();
                    startDashboardWatchdog(video);
                    dashboardFlvPlayer = flvjs.createPlayer({
                        type: 'flv',
                        url: res.data,
                        isLive: true,
                        cors: true,
                        lazyLoad: false,
                        enableStashBuffer: false,
                        autoCleanupSourceBuffer: true,
                        autoCleanupMaxBackwardDuration: 10,
                        autoCleanupMinBackwardDuration: 5
                    });
                    dashboardFlvPlayer.attachMediaElement(video);
                    dashboardFlvPlayer.load();
                    dashboardFlvPlayer.play();
                    video.onplaying = function () {
                        dashboardVideoReady = true;
                        dashboardLastProgressAt = Date.now();
                        startDashboardLatencyMonitor(video);
                        if (placeholder) placeholder.style.display = 'none';
                    };
                    video.onerror = function () {
                        dashboardVideoReady = false;
                        if (placeholder) placeholder.style.display = 'flex';
                        scheduleDashboardRecovery(800);
                    };
                    video.ontimeupdate = function () { dashboardLastProgressAt = Date.now(); };
                    video.onstalled = function () { scheduleDashboardRecovery(800); };
                    video.onwaiting = function () { scheduleDashboardRecovery(1200); };
                } catch (e) {
                    console.error('视频初始化失败:', e);
                    if (placeholder) placeholder.style.display = 'flex';
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initDashboardVideo);
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) initDashboardVideo();
        });
        window.addEventListener('pagehide', destroyDashboardPlayer);
        window.addEventListener('beforeunload', destroyDashboardPlayer);
    </script>
</body>
</html>
