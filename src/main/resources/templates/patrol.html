<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jhds - AI轨道巡检</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/patrol.css}">
    <script th:src="@{/js/lib/flv.min.js}"></script>
    <script th:src="@{/js/lib/hls.min.js}"></script>
</head>
<body>
    <div th:replace="fragments/header::header('patrol')"></div>

    <main class="main">
        <div class="patrol-layout">
            <div class="patrol-video-area">
                <div class="patrol-video">
                    <div class="video-header">
                        <div class="video-status">
                            <div class="status-dot"></div>
                            <span style="font-size:13px; font-weight:500;">轨道巡检摄像头</span>
                            <span class="status-badge camera-status-badge checking" id="camera-status-badge">检查中</span>
                            <span class="camera-connection-status checking" id="camera-connection-status" aria-live="polite">正在检查萤石连接</span>
                        </div>
                        <button type="button" class="video-records-btn" onclick="openPatrolRecords()"><i class="ri-gallery-line"></i>最近记录</button>

                    </div>
                    <div class="patrol-video-main">
                        <div class="patrol-scan-line"></div>
                        <video id="video-player" class="patrol-video-player" autoplay playsinline crossorigin="anonymous" draggable="false"></video>
                        <canvas id="realtime-detection-canvas" class="realtime-detection-canvas" aria-hidden="true"></canvas>
                        <div class="realtime-alert-banner" id="realtime-alert-banner" role="alert" hidden>
                            <i class="ri-alarm-warning-fill"></i>
                            <div><strong>发现疑似黑天牛</strong><span id="realtime-alert-detail">请立即复核现场画面</span></div>
                            <button type="button" onclick="dismissRealtimeAlert()" aria-label="关闭警告"><i class="ri-close-line"></i></button>
                        </div>
                        <div class="video-placeholder" id="video-placeholder"><i class="ri-camera-lens-line" style="font-size:64px;"></i><p>AI轨道巡检实时画面</p><p id="video-placeholder-message" style="font-size:11px; margin-top:4px; color:var(--text-dim);">正在检查萤石摄像头连接</p></div>
                        <div class="camera-stream-tools">
                            <button class="ctrl-btn encode" id="btn-encode" onclick="changeEncodeType()"><i class="ri-settings-4-line"></i>H.264 默认</button>
                            <label class="camera-quality-control" for="camera-quality">
                                <i class="ri-hd-line" aria-hidden="true"></i>
                                <select id="camera-quality" aria-label="视频清晰度" onchange="changeCameraQuality(this.value)">
                                    <option value="smooth">流畅 480p</option>
                                    <option value="hd" selected>高清 720p</option>
                                    <option value="4k">超清 4K</option>
                                </select>
                            </label>
                            <span class="camera-quality-status" id="camera-quality-status" aria-live="polite">画质待校验</span>
                            <button class="realtime-detect-toggle" id="realtime-detect-toggle" type="button" disabled aria-pressed="false"><i class="ri-radar-line"></i><span>虫害监测 已关闭</span></button>
                            <span class="realtime-detect-status" id="realtime-detect-status" aria-live="polite">监测已关闭</span>
                        </div>
                        <button class="audio-btn" id="btn-audio" type="button" onclick="toggleCameraAudio()"><i class="ri-volume-up-line"></i>开启声音</button>
                        <div class="video-view-controls" aria-label="网页画面缩放">
                            <button type="button" class="video-view-btn" onclick="adjustCameraZoom(-0.1)" title="缩小画面" aria-label="缩小画面"><i class="ri-zoom-out-line"></i></button>
                            <span id="camera-zoom-label">100%</span>
                            <button type="button" class="video-view-btn" onclick="adjustCameraZoom(0.1)" title="放大画面" aria-label="放大画面"><i class="ri-zoom-in-line"></i></button>
                            <button type="button" class="video-view-btn" onclick="resetCameraZoom()" title="恢复画面比例" aria-label="恢复画面比例"><i class="ri-refresh-line"></i></button>
                        </div>
                    </div>
                    <div class="patrol-control-cards">
                        <section class="patrol-control-card motor-control-card" aria-label="轨道电机控制">
                            <div class="control-card-heading"><i class="ri-route-line"></i><span>轨道电机</span><span class="panel-motion-connection" id="panel-motion-connection">控制面板检查中</span></div>
                            <div class="motor-direction-grid">
                                <button type="button" class="ctrl-btn" id="btn-left" data-motor-direction="left" aria-pressed="false" onclick="togglePatrolDir('left')"><i class="ri-arrow-left-line"></i><span>左移</span></button>
                                <button type="button" class="ctrl-btn" id="btn-right" data-motor-direction="right" aria-pressed="false" onclick="togglePatrolDir('right')"><i class="ri-arrow-right-line"></i><span>右移</span></button>
                                <button type="button" class="ctrl-btn panel-motion-btn" id="btn-panel-forward" data-panel-direction="forward" aria-pressed="false" onclick="togglePanelMotion('forward')"><i class="ri-arrow-up-line"></i><span>上移</span></button>
                                <button type="button" class="ctrl-btn panel-motion-btn" id="btn-panel-backward" data-panel-direction="backward" aria-pressed="false" onclick="togglePanelMotion('backward')"><i class="ri-arrow-down-line"></i><span>下移</span></button>
                            </div>
                            <div class="control-card-actions">
                                <button type="button" class="ctrl-btn stop" id="btn-stop" onclick="setPatrolDir('stop')"><i class="ri-pause-circle-line"></i><span>停止电机</span></button>
                                <button type="button" class="ctrl-btn" id="btn-ai-capture"><i class="ri-camera-2-line"></i><span>AI拍照识别</span></button>
                            </div>
                            <div class="motor-control-status" id="motor-control-status" aria-live="polite">轨道电机待命</div>
                            <div class="panel-motion-status" id="panel-motion-status" aria-live="polite">控制面板待命</div>
                        </section>
                        <section class="patrol-control-card ptz-controls" aria-label="摄像头云台控制">
                            <div class="control-card-heading"><i class="ri-focus-3-line"></i><span>摄像头云台</span><span class="ptz-status" id="ptz-status" aria-live="polite">云台待命</span></div>
                            <label class="ptz-speed-label">速度<select id="ptz-speed" class="ptz-speed"><option value="0">慢</option><option value="1" selected>中</option><option value="2">快</option></select></label>
                            <div class="ptz-pad">
                                <span></span><button type="button" class="ptz-btn" data-ptz-direction="0" aria-label="云台上移" title="上移"><i class="ri-arrow-up-line"></i></button><span></span>
                                <button type="button" class="ptz-btn" data-ptz-direction="2" aria-label="云台左移" title="左移"><i class="ri-arrow-left-line"></i></button><button type="button" class="ptz-btn ptz-stop" data-ptz-stop aria-label="停止云台" title="停止"><i class="ri-stop-circle-line"></i></button><button type="button" class="ptz-btn" data-ptz-direction="3" aria-label="云台右移" title="右移"><i class="ri-arrow-right-line"></i></button>
                                <span></span><button type="button" class="ptz-btn" data-ptz-direction="1" aria-label="云台下移" title="下移"><i class="ri-arrow-down-line"></i></button><span></span>
                            </div>
                            <div class="ptz-extra"><button type="button" class="ptz-btn" data-ptz-direction="8" aria-label="放大" title="放大"><i class="ri-zoom-in-line"></i></button><button type="button" class="ptz-btn" data-ptz-direction="9" aria-label="缩小" title="缩小"><i class="ri-zoom-out-line"></i></button></div>
                        </section>
                    </div>
                </div>
            </div>
            <div class="patrol-sidebar">
                <div class="card auto-patrol-card">
                    <div class="card-header"><i class="ri-route-line"></i><span>自动巡检方案</span><span class="auto-patrol-live" id="auto-patrol-live">待命</span></div>
                    <button class="patrol-warning" id="patrol-warning" type="button" onclick="openPatrolWarning()" hidden>
                        <i class="ri-alarm-warning-line"></i>
                        <span id="patrol-warning-text">⚠️花朵数量严重超标！</span>
                        <i class="ri-arrow-right-s-line"></i>
                    </button>
                    <div class="auto-patrol-body">
                        <div class="auto-patrol-plans" id="auto-patrol-plans">
                            <div class="auto-patrol-loading">正在读取巡检方案</div>
                        </div>
                        <div class="auto-patrol-status" aria-live="polite">
                            <div class="auto-patrol-phase"><span id="auto-patrol-phase">等待开始</span><strong id="auto-patrol-progress-text">0%</strong></div>
                            <div class="auto-patrol-progress"><span id="auto-patrol-progress-bar"></span></div>
                            <div class="auto-patrol-metrics">
                                <span><i class="ri-layout-row-line"></i><b id="auto-patrol-row">0/0</b> 扫描线</span>
                                <span><i class="ri-camera-line"></i><b id="auto-patrol-captures">0</b> 张</span>
                                <span><i class="ri-4k-line"></i><b id="auto-patrol-quality">4K待验证</b> 抓拍</span>
                            </div>
                            <div class="auto-patrol-output" id="auto-patrol-output" title="">保存目录检查中</div>
                            <div class="auto-patrol-message" id="auto-patrol-message" hidden></div>
                        </div>
                        <label class="auto-patrol-origin">
                            <input type="checkbox" id="auto-patrol-origin-confirmed" onchange="updateAutomaticPatrolActions()">
                            <span>右下安全起点已确认</span>
                        </label>
                        <div class="auto-patrol-actions">
                            <button type="button" class="btn-primary" id="auto-patrol-start" onclick="startAutomaticPatrol()" disabled><i class="ri-play-fill"></i>开始巡检</button>
                            <button type="button" class="auto-patrol-stop" id="auto-patrol-stop" onclick="stopAutomaticPatrol()" disabled><i class="ri-stop-fill"></i>紧急停止</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="patrol-records-overlay" id="patrolRecordsOverlay" hidden>
        <section class="patrol-records-modal" role="dialog" aria-modal="true" aria-labelledby="patrol-records-title">
            <header class="patrol-records-header">
                <h2 id="patrol-records-title"><i class="ri-image-line"></i>最近拍摄记录</h2>
                <button type="button" onclick="closePatrolRecords()" aria-label="关闭"><i class="ri-close-line"></i></button>
            </header>
            <div id="patrol-records" class="patrol-records-grid">
                <div class="record-placeholder"><i class="ri-image-line"></i></div>
                <div class="record-placeholder"><i class="ri-image-line"></i></div>
                <div class="record-placeholder"><i class="ri-image-line"></i></div>
            </div>
        </section>
    </div>

    <!-- AI拍照识别结果弹窗 -->
    <div class="ai-capture-overlay" id="aiCaptureOverlay" style="display:none;">
        <div class="ai-capture-modal">
            <div class="ai-capture-header">
                <div class="ai-capture-header-left"><i class="ri-robot-2-line"></i> AI 拍照识别</div>
                <button class="ai-capture-close" onclick="closeAiCapture()">&times;</button>
            </div>
            <div class="ai-capture-body">
                <div class="ai-capture-image-area">
                    <img id="capturePreview" src="" alt="拍摄画面">
                </div>
                <div class="ai-capture-result-area">
                    <div class="ai-capture-result-header"><i class="ri-file-list-3-line"></i> 分析结果</div>
                    <div class="ai-capture-result-content" id="captureResult">
                        <div class="ai-capture-thinking">
                            <div class="thinking-spinner"></div>
                            <span>AI 正在分析中，请稍候...</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ai-capture-footer">
                <button class="capture-btn capture-btn-secondary" onclick="closeAiCapture()">关闭</button>
                <button class="capture-btn capture-btn-primary" id="retryCaptureBtn" onclick="retryAiCapture()" style="display:none;"><i class="ri-refresh-line"></i> 重新识别</button>
            </div>
        </div>
    </div>

    <div class="patrol-warning-overlay" id="patrolWarningOverlay" hidden>
        <section class="patrol-warning-modal" role="dialog" aria-modal="true" aria-labelledby="patrol-warning-title">
            <header class="patrol-warning-header">
                <h2 id="patrol-warning-title"><i class="ri-alarm-warning-line"></i> <span id="patrol-warning-modal-title">花朵数量严重超标</span></h2>
                <button type="button" onclick="closePatrolWarning()" aria-label="关闭"><i class="ri-close-line"></i></button>
            </header>
            <div class="patrol-warning-images" id="patrol-warning-images">
                <img th:src="@{/images/alerts/flower-overload-c2.png}" alt="C2 区花朵数量严重超标">
                <img th:src="@{/images/alerts/flower-overload-c1.png}" alt="C1 区花朵数量严重超标">
            </div>
        </section>
    </div>

    <div class="ai-float" onclick="location.href='/jhds/ai'" style="cursor:pointer;">
        <i class="ri-robot-2-line"></i>
        <span>AI 农业管家</span>
        <span>点击开始对话</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/patrol.js(v='20260908-realtime-yolo')}"></script>
</body>
</html>
